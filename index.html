<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>发货信息解析</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<main class="wrap">
  <h1 class="title">发货信息解析</h1>
  <p class="subtitle">粘贴收货信息，自动解析出收货人、联系电话、收货地址、商品、规格、数量</p>

  <textarea id="input-text" class="input-text" spellcheck="false"
    placeholder="在此粘贴收货信息，例如：&#10;广东省广州市天河区示例大道1号张三13800138000 2箱&#10;北京市朝阳区示范路88号李四13900139000 苹果10箱梨5箱"></textarea>

  <div class="btn-row">
    <button id="btn-clear" class="btn btn-del" type="button">删除</button>
    <button id="btn-parse" class="btn btn-parse" type="button">解析</button>
  </div>
</main>

<!-- 解析结果弹框 -->
<div class="modal-mask" id="modal-mask">
  <div class="modal">
    <div class="modal-head">
      <h3>解析结果</h3>
      <button class="modal-close" id="modal-close" type="button" title="关闭">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot">
      <button class="m-btn m-btn-ghost" id="modal-copy" type="button">复制</button>
      <button class="m-btn m-btn-primary" id="modal-close-btn" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
